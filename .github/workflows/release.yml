# Releases vamos: publishes the image, built from the repository's Dockerfile, to GitHub Packages
# as one index for linux/amd64 and linux/arm64, then creates the GitHub Release v<tag> at the commit,
# with each platform's binary, vamos-linux-amd64 and vamos-linux-arm64, install.sh and their SHA256SUMS.
# It runs only when started by hand: Actions > release > Run workflow, or `gh workflow run release.yml -f tag=0.1.0`.
# A version without a suffix also moves the image's latest tag and becomes the latest release;
# one such as 0.2.0-rc.1 is a prerelease and moves neither.
# See .agents/kb/remote-environment.md for when to release and how the chart names the image.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version, such as 0.1.0, which tags the image and, as v0.1.0, the commit
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  # Each platform builds on a runner of its own architecture: buildah needs cgo,
  # so cross-compiling is impractical and QEMU makes the Go build many times slower.
  # Each pushes its image by digest alone; merge tags the index of both.
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # A release can't be replaced, so a version already tagged fails before anything is built.
      - env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ $TAG =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::$TAG isn't a version such as 0.1.0 or 0.2.0-rc.1"; exit 1; }
          if git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/v$TAG"; then
            echo "::error::v$TAG is already tagged"; exit 1
          fi

      # ghcr.io requires a lowercase repository name.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=v${{ inputs.tag }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      # The binary stage reuses the image's build from the cache, so the release's binary is the image's.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: binary
          platforms: ${{ matrix.platform }}
          build-args: VERSION=v${{ inputs.tag }}
          outputs: type=local,dest=${{ runner.temp }}/dist
          cache-from: type=gha,scope=${{ matrix.arch }}

      # install.sh and the tutorial promise the glibc that install.sh checks for; the binary must need no newer.
      - run: |
          mv "$RUNNER_TEMP/dist/vamos" "$RUNNER_TEMP/dist/vamos-linux-${{ matrix.arch }}"
          minimum=$(sed -n 's/^glibc_minimum=\([0-9.]*\).*/\1/p' install.sh)
          needed=$(objdump -T "$RUNNER_TEMP/dist/vamos-linux-${{ matrix.arch }}" \
            | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "the binary needs glibc $needed; install.sh checks for $minimum"
          [ "$(printf '%s\n' "$needed" "$minimum" | sort -V | tail -1)" = "$minimum" ]

      # Installs this platform's binary with the working tree's install.sh, as the tutorial's devcontainer Dockerfile
      # does on Ubuntu 24.04, from this build rather than the release, and builds an example with it;
      # a failure leaves the digest out, so merge tags nothing and no release is made.
      # Under emulation buildah can't re-execute itself, so only a native runner can check this.
      - name: smoke test
        env:
          TAG: ${{ inputs.tag }}
        run: |
          context="$RUNNER_TEMP/devcontainer"
          mkdir "$context"
          cp -r install.sh "$RUNNER_TEMP/dist" "$context/"
          (cd "$context/dist" && sha256sum vamos-linux-* > SHA256SUMS)
          awk '/^```dockerfile/ { f = 1; next } /^```/ { f = 0 } f' docs/tutorial.md \
            | sed 's#^ADD https://github.com/Topher-the-Geek/vamos/releases/download/[^ ]* /tmp/vamos-install.sh$#COPY install.sh /tmp/vamos-install.sh\nCOPY dist /tmp/dist\nENV VAMOS_RELEASE_URL=file:///tmp/dist#' \
            > "$context/Dockerfile"
          grep -qx 'COPY dist /tmp/dist' "$context/Dockerfile"
          docker buildx build --load -t vamos-devcontainer "$context"
          docker run --rm vamos-devcontainer vamos --version | grep -qx "vamos version v$TAG"
          # Without the packages, install.sh installs vamos and fails, unless --allow-missing.
          docker run --rm -v "$context:/w:ro" -e VAMOS_RELEASE_URL=file:///w/dist ubuntu:24.04 sh -c '
            apt-get -qq update && apt-get -qq install -y curl >/dev/null
            if sh /w/install.sh; then echo "install.sh succeeded without the packages" >&2; exit 1; fi
            test -x /usr/local/bin/vamos && sh /w/install.sh --allow-missing'
          docker run --rm --privileged -v vamos-storage:/var/lib/containers \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/examples/typescript-mcp:/example" \
            vamos-devcontainer vamos load server vamos-example -C /example
          docker run -i --rm vamos-example < examples/typescript-mcp/echo-request.jsonl \
            | grep -F '{"result":{"content":[{"type":"text","text":"hola"}]},"jsonrpc":"2.0","id":2}'

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/vamos-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

      - run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag, '-') }}
            type=sha

      # The source annotation on the index is what ghcr.io shows and links the package by.
      - working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            $(printf "$IMAGE@sha256:%s " *)

      - run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  # Tags the commit only once both platforms' images are published, so a release's assets match its image.
  release:
    needs: merge
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/dist
          pattern: binary-*
          merge-multiple: true

      # The release's install.sh installs that release unless told otherwise.
      - env:
          TAG: ${{ inputs.tag }}
        working-directory: ${{ runner.temp }}/dist
        run: |
          # shellcheck disable=SC2016 # the sed expression names install.sh's variable, not the step's
          sed 's/^version=${VAMOS_VERSION:-latest}$/version=${VAMOS_VERSION:-'"$TAG"'}/' \
            "$GITHUB_WORKSPACE/install.sh" > install.sh
          grep -qxF "version=\${VAMOS_VERSION:-$TAG}" install.sh
          sha256sum vamos-linux-amd64 vamos-linux-arm64 install.sh > SHA256SUMS
          cat SHA256SUMS

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        working-directory: ${{ runner.temp }}/dist
        run: |
          if [[ $TAG == *-* ]]; then latest=--prerelease; else latest=--latest; fi
          gh release create "v$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "vamos $TAG" \
            --generate-notes "$latest" vamos-linux-amd64 vamos-linux-arm64 install.sh SHA256SUMS
