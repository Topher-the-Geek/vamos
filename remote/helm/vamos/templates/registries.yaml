{{- /*
The cache registry and the pull-through caches: plain CNCF Distribution registries, nothing vamos-specific,
each a StatefulSet with its storage, behind a Service that everyone names it by.
*/}}
{{- define "vamos.registry" }}
{{- $root := .root }}
{{- $component := .component }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vamos.fullname" $root }}-{{ $component }}
  labels:
    {{- include "vamos.labels" $root | nindent 4 }}
    {{- include "vamos.selectorLabels" (dict "root" $root "component" $component) | nindent 4 }}
  {{- with .service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- include "vamos.serviceSpec" (dict "root" $root "component" $component "service" .service) | nindent 2 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vamos.fullname" $root }}-{{ $component }}
  labels:
    {{- include "vamos.labels" $root | nindent 4 }}
    {{- include "vamos.selectorLabels" (dict "root" $root "component" $component) | nindent 4 }}
spec:
  replicas: 1 # its storage is a volume of its own
  serviceName: {{ include "vamos.fullname" $root }}-{{ $component }}
  selector:
    matchLabels:
      {{- include "vamos.selectorLabels" (dict "root" $root "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vamos.labels" $root | nindent 8 }}
        {{- include "vamos.selectorLabels" (dict "root" $root "component" $component) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: registry
          image: {{ printf "%s:%s" .image.repository .image.tag }}
          imagePullPolicy: {{ .image.pullPolicy }}
          env:
            - name: REGISTRY_LOG_LEVEL
              value: {{ .logLevel | quote }}
            {{- with .env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          # The API's root answers once the registry listens.
          readinessProbe:
            httpGet:
              path: /v2/
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v2/
              port: http
            periodSeconds: 10
            failureThreshold: 6
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      {{- if not .persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "vamos.selectorLabels" (dict "root" $root "component" $component) | nindent 10 }}
      spec:
        {{- include "vamos.pvcSpec" .persistence | nindent 8 }}
  {{- end }}
{{- end }}

{{- with .Values.cacheRegistry }}
{{- if .enabled }}
{{- /* Deletion must be enabled so that a prune can remove tags; the space returns when garbage collection runs. */}}
{{- $env := concat (list (dict "name" "REGISTRY_STORAGE_DELETE_ENABLED" "value" "true")) .extraEnv }}
{{- include "vamos.registry" (dict "root" $ "component" "registry" "service" .service "image" .image
  "logLevel" .logLevel "env" $env "persistence" .persistence "resources" .resources
  "nodeSelector" .nodeSelector "tolerations" .tolerations "affinity" .affinity) }}
{{- end }}
{{- end }}

{{- range $name, $cache := .Values.pullThrough.caches }}
{{- if $cache.enabled }}
{{- /* Proxy mode mirrors one upstream and refuses pushes; upstream credentials belong here, on the proxy. */}}
{{- $env := list (dict "name" "REGISTRY_PROXY_REMOTEURL" "value" $cache.remoteURL) }}
{{- with $cache.credentials.secret }}
{{- $env = append $env (dict "name" "REGISTRY_PROXY_USERNAME"
  "valueFrom" (dict "secretKeyRef" (dict "name" . "key" $cache.credentials.usernameKey))) }}
{{- $env = append $env (dict "name" "REGISTRY_PROXY_PASSWORD"
  "valueFrom" (dict "secretKeyRef" (dict "name" . "key" $cache.credentials.passwordKey))) }}
{{- end }}
{{- $p := $.Values.pullThrough }}
{{- include "vamos.registry" (dict "root" $ "component" $name "service" $cache.service "image" $p.image
  "logLevel" $p.logLevel "env" $env "persistence" $cache.persistence "resources" $cache.resources
  "nodeSelector" $p.nodeSelector "tolerations" $p.tolerations "affinity" $p.affinity) }}
{{- end }}
{{- end }}
