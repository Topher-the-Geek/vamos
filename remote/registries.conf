# Registry settings for a process on the compose network of remote/compose.yaml: the cache registry and the
# pull-through cache speak plain HTTP there, which containers/image refuses unless the registry is marked insecure.
# A client in the devcontainer points CONTAINERS_REGISTRIES_CONF at it; the services get the same content from the
# compose file, since a devcontainer path can't be mounted into them. Keep the two the same.
[[registry]]
location = "registry:5000"
insecure = true

[[registry]]
location = "hub-proxy:5000"
insecure = true
